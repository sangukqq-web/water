<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활 유틸리티</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #86868b;
    --accent: #0071e3;
    --good: #34c759;
    --warn: #ff9500;
    --bad: #ff3b30;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'AppleSDGothicNeo', 'Pretendard', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px;
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .subtitle { text-align: center; color: var(--sub); font-size: 14px; margin-bottom: 20px; }

  .settings-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .settings-bar > * { font-size: 13px; }
  .settings-bar input, .settings-bar select {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border: 1.5px solid #d2d2d7;
    border-radius: 8px;
    background: white;
    outline: none;
  }
  .settings-bar input:focus, .settings-bar select:focus { border-color: var(--accent); }
  .settings-bar input[type=number] { width: 56px; text-align: center; }
  .settings-bar #user-summary { color: var(--accent); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .icon { font-size: 18px; }

  /* 물 트래커 */
  .cup-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .cup-chip {
    background: #f0f0f5;
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
    border: 1.5px solid transparent;
    user-select: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .cup-chip:hover { background: #e8e8ef; }
  .cup-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .count-display {
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 4px;
  }
  .count-label { text-align: center; color: var(--sub); font-size: 13px; }
  .progress-wrap {
    background: #e8e8ef;
    border-radius: 10px;
    height: 14px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-bar {
    height: 100%;
    background: var(--good);
    border-radius: 10px;
    transition: width 0.4s ease;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    background: #f0f0f5;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    flex: 1;
    min-width: 60px;
    text-align: center;
    font-family: inherit;
  }
  .btn:hover { background: #e4e4ea; }
  .btn.primary { background: var(--accent); color: white; }
  .btn.primary:hover { background: #0061b9; }
  .btn.danger { background: var(--bad); color: white; }
  .btn.danger:hover { background: #d63326; }
  .btn.good { background: var(--good); color: white; }
  .btn.good:hover { background: #2aaf4a; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 식사 기록 */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip {
    background: #f0f0f5;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1.5px solid transparent;
    user-select: none;
    font-family: inherit;
  }
  .chip:hover { background: #e8e8ef; }
  .chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .meal-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f5;
    font-size: 14px;
  }
  .meal-item:last-child { border-bottom: none; }
  .meal-item .mname { flex: 1; }
  .meal-item .mcal { font-weight: 600; color: var(--accent); min-width: 52px; text-align: right; }
  .meal-item .mdel {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #d2d2d7;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--bad);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .meal-item .mdel:hover { border-color: var(--bad); background: #fff0f0; }
  .meal-chip {
    background: #f0f0f5;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    border: 1.5px solid transparent;
    user-select: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  .meal-chip:hover { background: #e8e8ef; }
  .meal-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .meal-chip .kcal { color: var(--sub); font-size: 11px; }
  .meal-chip.active .kcal { color: rgba(255,255,255,0.85); }

  /* 할 일 */
  .habit-list { list-style: none; }
  .habit-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f5;
    font-size: 14px;
  }
  .habit-item:last-child { border-bottom: none; }
  .habit-item .check {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #d2d2d7;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: white;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .habit-item .check:hover { border-color: var(--accent); }
  .habit-item.done .check {
    background: var(--good);
    border-color: var(--good);
  }
  .habit-item.done .htxt { text-decoration: line-through; color: var(--sub); }
  .habit-item .htxt { flex: 1; }
  .habit-item .hdel {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #d2d2d7;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--bad);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .habit-item .hdel:hover { border-color: var(--bad); background: #fff0f0; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>생활 유틸리티</h1>
  <p class="subtitle">물 · 식사 기록 · 할 일</p>

  <!-- 내 정보 설정 -->
  <div class="settings-bar">
    <span style="font-size:13px;color:var(--sub);margin-right:4px">내 정보</span>
    <input type="number" id="user-weight" value="65" min="20" max="300" step="0.1">
    <span style="font-size:13px;color:var(--sub)">kg</span>
    <input type="number" id="user-height" value="172" min="50" max="250" step="1">
    <span style="font-size:13px;color:var(--sub)">cm</span>
    <select id="user-sex">
      <option value="male">남</option>
      <option value="female">여</option>
    </select>
    <input type="number" id="user-age" value="30" min="10" max="120">
    <span style="font-size:13px;color:var(--sub)">세</span>
    <select id="user-activity">
      <option value="낮음">적게</option>
      <option value="가벼움">보통 미만</option>
      <option value="보통" selected>보통</option>
      <option value="활발">활발</option>
      <option value="매우 활발">매우</option>
    </select>
    <button class="btn" id="user-apply" style="margin-left:6px;font-size:12px;padding:6px 12px;flex:0 0 auto">적용</button>
    <span id="user-summary" style="font-size:12px;color:var(--sub);margin-left:10px;flex:1;text-align:right;white-space:nowrap;overflow:hidden"></span>
  </div>

  <div class="grid">
    <!-- 물 트래커 -->
    <div class="card">
      <h2><span class="icon">💧</span> 오늘의 물</h2>
      <div class="cup-row" id="cup-row"></div>
      <div class="count-display" id="water-count">0</div>
      <div class="count-label"><span id="water-unit">ml</span> / 목표 <span id="water-goal">2,000</span>ml</div>
      <div class="progress-wrap"><div class="progress-bar" id="water-progress" style="width:0%"></div></div>
      <div class="btn-row">
        <button class="btn good" id="water-add-btn">+ 마셨다</button>
        <button class="btn danger" id="water-reset-btn" style="flex:0 0 auto">물 기록 초기화</button>
      </div>
    </div>

    <!-- 식단 기록 -->
    <div class="card">
      <h2><span class="icon">🍽️</span> 오늘의 식사</h2>
      <div class="chip-row" id="meal-view-chips">
        <span class="chip active" data-view="목표">목표 대비</span>
        <span class="chip" data-view="남은">남은 칼로리</span>
      </div>
      <div class="count-display" id="meal-count">0</div>
      <div class="count-label" id="meal-count-label">kcal / 목표 <span id="meal-goal">0</span> kcal</div>
      <div class="progress-wrap"><div class="progress-bar" id="meal-progress" style="width:0%"></div></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input type="text" id="meal-name" placeholder="메뉴 이름" style="flex:1;padding:10px 12px;border:1.5px solid #d2d2d7;border-radius:10px;font-size:14px;font-family:inherit;outline:none">
        <input type="number" id="meal-cal" placeholder="kcal" min="0" style="width:72px;padding:10px 12px;border:1.5px solid #d2d2d7;border-radius:10px;font-size:14px;text-align:center;font-family:inherit;outline:none">
        <button class="btn primary" id="meal-add-btn" style="flex:0 0 auto;padding:10px 14px">추가</button>
      </div>
      <ul class="meal-list" id="meal-list" style="margin-top:12px"></ul>
      <button class="btn danger" id="meal-reset-btn" style="margin-top:10px;width:100%;font-size:12px">식사 기록 초기화</button>
    </div>

    <!-- 할 일 -->
    <div class="card" style="grid-column: span 2">
      <h2><span class="icon">✅</span> 오늘의 할 일</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input type="text" id="habit-input" placeholder="할 일을 입력하고 Enter" style="flex:1;padding:10px 12px;border:1.5px solid #d2d2d7;border-radius:10px;font-size:14px;font-family:inherit;outline:none">
        <button class="btn primary" id="habit-add-btn" style="flex:0 0 auto;padding:10px 14px">추가</button>
      </div>
      <ul class="habit-list" id="habit-list"></ul>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- 공용 ----------
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- 내 정보 / 칼로리·물 목표 ----------
  const userWeight = document.getElementById('user-weight');
  const userHeight = document.getElementById('user-height');
  const userSex = document.getElementById('user-sex');
  const userAge = document.getElementById('user-age');
  const userActivity = document.getElementById('user-activity');
  const userApply = document.getElementById('user-apply');
  const userSummary = document.getElementById('user-summary');
  const waterGoalEl = document.getElementById('water-goal');
  const mealGoalEl = document.getElementById('meal-goal');

  const ACTIVITY_FACTOR = { '낮음': 1.2, '가벼움': 1.375, '보통': 1.55, '활발': 1.725, '매우 활발': 1.9 };

  function calcTargets() {
    const kg = Number(userWeight.value) || 65;
    const cm = Number(userHeight.value) || 172;
    const age = Number(userAge.value) || 30;
    const sex = userSex.value;
    const act = userActivity.value;
    const bmr = 10 * kg + 6.25 * cm - 5 * age + (sex === 'male' ? 5 : -161);
    const tdee = Math.round(bmr * (ACTIVITY_FACTOR[act] || 1.55));
    const water = Math.round(kg * 33);
    userSummary.textContent = `${tdee} kcal · 물 ${water.toLocaleString()}ml (${Math.round(water/1000*10)/10}L)`;
    waterGoalEl.textContent = water.toLocaleString();
    mealGoalEl.textContent = tdee.toLocaleString();
    waterRefresh();
    mealRefresh();
  }
  userApply.addEventListener('click', calcTargets);
  [userWeight, userHeight, userSex, userAge, userActivity].forEach(el => {
    el.addEventListener('change', calcTargets);
    el.addEventListener('input', calcTargets);
  });
  calcTargets();

  // ---------- 물 트래커 ----------
  const cupRow = document.getElementById('cup-row');
  const waterCountEl = document.getElementById('water-count');
  const waterUnitEl = document.getElementById('water-unit');
  const waterGoalEl2 = document.getElementById('water-goal');
  const waterProgressEl = document.getElementById('water-progress');
  const waterAddBtn = document.getElementById('water-add-btn');
  const waterResetBtn = document.getElementById('water-reset-btn');

  let cupSize = 200;
  const CUP_SIZES = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500];

  function cupInit() {
    cupRow.innerHTML = CUP_SIZES.map(s =>
      `<button class="cup-chip${s === cupSize ? ' active' : ''}" data-size="${s}">${s}ml</button>`
    ).join('');
  }
  cupRow.addEventListener('click', e => {
    const chip = e.target.closest('.cup-chip');
    if (!chip) return;
    cupSize = Number(chip.dataset.size);
    cupRow.querySelectorAll('.cup-chip').forEach(c => c.classList.toggle('active', Number(c.dataset.size) === cupSize));
  });

  function waterSave(ml) {
    const items = JSON.parse(localStorage.getItem('lifetools_water') || '[]');
    items.push({ ml: Math.max(0, Math.round(ml)), ts: Date.now() });
    localStorage.setItem('lifetools_water', JSON.stringify(items));
    waterRefresh();
  }
  function waterReset() {
    if (!confirm('오늘의 물 기록을 모두 삭제해요.')) return;
    localStorage.removeItem('lifetools_water');
    waterRefresh();
  }
  function waterRefresh() {
    const items = JSON.parse(localStorage.getItem('lifetools_water') || '[]');
    const total = items.reduce((s, it) => s + it.ml, 0);
    const goal = Number(waterGoalEl.textContent) || 0;
    waterCountEl.textContent = total.toLocaleString();
    waterUnitEl.textContent = goal >= 1000 ? 'ml' : 'ml';
    const pct = goal > 0 ? Math.min(100, (total / goal) * 100) : 0;
    waterProgressEl.style.width = pct + '%';
    waterProgressEl.style.background = pct >= 100 ? 'var(--good)' : pct > 80 ? 'var(--warn)' : 'var(--good)';
  }
  waterAddBtn.addEventListener('click', () => {
    waterSave(cupSize);
    toast(`${cupSize}ml 추가!`);
  });
  waterResetBtn.addEventListener('click', waterReset);
  cupInit();
  waterRefresh();

  // ---------- 식단 기록 ----------
  const mealListEl = document.getElementById('meal-list');
  const mealNameEl = document.getElementById('meal-name');
  const mealCalEl = document.getElementById('meal-cal');
  const mealAddBtn = document.getElementById('meal-add-btn');
  const mealResetBtn = document.getElementById('meal-reset-btn');
  const mealCountEl = document.getElementById('meal-count');
  const mealProgressEl = document.getElementById('meal-progress');
  const mealViewChips = document.getElementById('meal-view-chips');
  const mealCountLabel = document.getElementById('meal-count-label');

  let mealView = '목표';
  const QUICK_MEALS = [
    ['쌀밥 한 공기', 300], ['김밥 한 줄', 430], ['된장찌개 한 그릇', 200],
    ['계란 프라이 2개', 190], ['닭가슴살 구이', 165], ['고구마 중간 1개', 130],
    ['바나나 1개', 105], ['샐러드 (드레싱)', 120],
    ['아이스 아메리카노', 10], ['우유 한 컵 200ml', 120], ['삶은 계란 2개', 155]
  ];

  function mealSave(text, cal) {
    const items = JSON.parse(localStorage.getItem('lifetools_meals') || '[]');
    items.push({ text, cal: Math.max(0, Math.round(cal)), ts: Date.now() });
    localStorage.setItem('lifetools_meals', JSON.stringify(items));
    mealRefresh();
  }
  function mealDelete(i) {
    const items = JSON.parse(localStorage.getItem('lifetools_meals') || '[]');
    items.splice(i, 1);
    localStorage.setItem('lifetools_meals', JSON.stringify(items));
    mealRefresh();
  }
  function mealReset() {
    if (!confirm('오늘의 식사 기록을 모두 삭제해요.')) return;
    localStorage.removeItem('lifetools_meals');
    mealRefresh();
  }
  function mealRender() {
    const items = JSON.parse(localStorage.getItem('lifetools_meals') || '[]');
    const goal = Number(mealGoalEl.textContent) || 0;
    const total = items.reduce((s, it) => s + it.cal, 0);
    mealCountEl.textContent = total.toLocaleString();
    const pct = goal > 0 ? Math.min(100, (total / goal) * 100) : 0;
    mealProgressEl.style.width = pct + '%';
    mealProgressEl.style.background = pct > 100 ? 'var(--bad)' : pct > 80 ? 'var(--warn)' : 'var(--good)';

    let html = '';
    items.forEach((it, i) => {
      html += `<li class="meal-item">
        <div class="mname">${escapeHtml(it.text)}</div>
        <div class="mcal">+${it.cal.toLocaleString()} kcal</div>
        <div class="mdel" data-act="del" data-i="${i}">×</div>
      </li>`;
    });
    if (!html) {
      html = `<li style="color:var(--sub);font-size:13px;padding:6px 0">아직 식사를 기록하지 않았어요</li>`;
    }
    mealListEl.innerHTML = html;

    if (mealView === '남은') {
      const left = Math.max(0, goal - total);
      mealCountLabel.innerHTML = `남은 칼로리 <strong>${left.toLocaleString()}</strong> kcal / 목표 ${goal.toLocaleString()} kcal`;
      mealProgressEl.style.background = left > goal * 0.2 ? 'var(--good)' : 'var(--warn)';
    } else {
      mealCountLabel.innerHTML = `kcal / 목표 <span id="meal-goal">${goal.toLocaleString()}</span> kcal`;
    }
  }
  function mealRefresh() {
    const goal = Number(mealGoalEl.textContent) || 0;
    const items = JSON.parse(localStorage.getItem('lifetools_meals') || '[]');
    const total = items.reduce((s, it) => s + it.cal, 0);
    mealCountEl.textContent = total.toLocaleString();
    const pct = goal > 0 ? Math.min(100, (total / goal) * 100) : 0;
    mealProgressEl.style.width = pct + '%';
    mealProgressEl.style.background = pct > 100 ? 'var(--bad)' : pct > 80 ? 'var(--warn)' : 'var(--good)';
    if (mealView === '남은') {
      const left = Math.max(0, goal - total);
      mealCountLabel.innerHTML = `남은 칼로리 <strong>${left.toLocaleString()}</strong> kcal / 목표 ${goal.toLocaleString()} kcal`;
      mealProgressEl.style.background = left > goal * 0.2 ? 'var(--good)' : 'var(--warn)';
    } else {
      mealCountLabel.innerHTML = `kcal / 목표 <span id="meal-goal">${goal.toLocaleString()}</span> kcal`;
    }
    let html = '';
    items.forEach((it, i) => {
      html += `<li class="meal-item">
        <div class="mname">${escapeHtml(it.text)}</div>
        <div class="mcal">+${it.cal.toLocaleString()} kcal</div>
        <div class="mdel" data-act="del" data-i="${i}">×</div>
      </li>`;
    });
    if (!html) html = `<li style="color:var(--sub);font-size:13px;padding:6px 0">아직 식사를 기록하지 않았어요</li>`;
    mealListEl.innerHTML = html;
  }

  mealViewChips.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip || !chip.dataset.view) return;
    mealViewChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    mealView = chip.dataset.view;
    mealRefresh();
  });

  mealAddBtn.addEventListener('click', () => {
    const text = mealNameEl.value.trim();
    const cal = Number(mealCalEl.value);
    if (!text) return;
    mealSave(text, isNaN(cal) ? 0 : cal);
    mealNameEl.value = '';
    mealCalEl.value = '';
    mealNameEl.focus();
    toast('식사 추가!');
  });
  mealNameEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !mealCalEl.value) mealCalEl.focus();
  });
  mealCalEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') mealAddBtn.click();
  });
  mealListEl.addEventListener('click', e => {
    const del = e.target.closest('.mdel');
    if (!del) return;
    mealDelete(Number(del.dataset.i));
  });
  mealResetBtn.addEventListener('click', mealReset);
  mealRefresh();

  // 퀵 식사 칩 (식사 카드 하단에 추가)
  const mealCard = document.querySelector('.card h2 + .chip-row')?.parentElement;
  if (mealCard) {
    const quickRow = document.createElement('div');
    quickRow.style.cssText = 'margin-top:12px';
    quickRow.innerHTML = `<div style="font-size:12px;color:var(--sub);margin-bottom:6px">빠른 추가</div>` +
      QUICK_MEALS.map(([name, cal]) =>
        `<button class="meal-chip" data-name="${escapeHtml(name)}" data-cal="${cal}">${name} <span class="kcal">${cal}kcal</span></button>`
      ).join('');
    mealCard.appendChild(quickRow);

    quickRow.addEventListener('click', e => {
      const chip = e.target.closest('.meal-chip');
      if (!chip) return;
      mealNameEl.value = chip.dataset.name;
      mealCalEl.value = chip.dataset.cal;
      mealAddBtn.click();
    });
  }

  // ---------- 할 일 ----------
  const habitList = document.getElementById('habit-list');
  const habitInput = document.getElementById('habit-input');
  const habitAddBtn = document.getElementById('habit-add-btn');

  function habitSave(text, done) {
    const items = JSON.parse(localStorage.getItem('lifetools_habits') || '[]');
    items.push({ text, done: !!done, ts: Date.now() });
    localStorage.setItem('lifetools_habits', JSON.stringify(items));
    habitRender();
  }
  function habitRender() {
    const items = JSON.parse(localStorage.getItem('lifetools_habits') || '[]');
    if (!items.length) {
      habitList.innerHTML = `<li style="color:var(--sub);font-size:13px;padding:8px 0">아직 할 일이 없어요</li>`;
      return;
    }
    habitList.innerHTML = items.map((it, i) =>
      `<li class="habit-item${it.done ? ' done' : ''}" data-i="${i}">
        <div class="check" data-act="toggle">${it.done ? '✓' : ''}</div>
        <div class="htxt">${escapeHtml(it.text)}</div>
        <div class="hdel" data-act="del">×</div>
      </li>`
    ).join('');
  }
  function habitUpdate(i, field, val) {
    const items = JSON.parse(localStorage.getItem('lifetools_habits') || '[]');
    if (items[i]) items[i][field] = val;
    localStorage.setItem('lifetools_habits', JSON.stringify(items));
    habitRender();
  }
  habitList.addEventListener('click', e => {
    const item = e.target.closest('.habit-item');
    if (!item) return;
    const i = Number(item.dataset.i);
    const act = e.target.dataset.act;
    if (act === 'toggle') habitUpdate(i, 'done', !JSON.parse(localStorage.getItem('lifetools_habits') || '[]')[i].done);
    if (act === 'del') {
      const items = JSON.parse(localStorage.getItem('lifetools_habits') || '[]');
      items.splice(i, 1);
      localStorage.setItem('lifetools_habits', JSON.stringify(items));
      habitRender();
    }
  });
  habitAddBtn.addEventListener('click', () => {
    const text = habitInput.value.trim();
    if (!text) return;
    habitSave(text, false);
    habitInput.value = '';
    habitInput.focus();
  });
  habitInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') habitAddBtn.click();
  });
  habitRender();
  window.addEventListener('load', () => habitInput.focus());

  // ---------- 첫 입력 자동 포커스 ----------
  window.addEventListener('load', () => {
    const now = new Date();
    const h = now.getHours();
    if (h >= 5 && h < 11) mealNameEl?.focus();
    else if (h >= 11 && h < 14) waterAddBtn?.focus();
    else habitInput?.focus();
  });
</script>
</body>
</html>
